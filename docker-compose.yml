version: "3.9"

services:
  app:
    build: .
    container_name: mindvideo-creator
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - THREADS=1
      - OUTPUT_FILE=/app/accounts.txt
      - LOG_LEVEL=INFO
    volumes:
      - ./accounts.txt:/app/accounts.txt
    shm_size: "256mb"     # give Chromium proper shared memory — avoids /dev/shm OOM
